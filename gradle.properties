# JVM headroom for Kotlin + R8 on a CI runner.
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8

# Build speed: independent modules in parallel, results cached between runs,
# and configuration read only when it changes.
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
# Each module gets only its own R fields, which keeps the R classes small and
# helps R8 strip unused resources.
android.nonTransitiveRClass=true

kotlin.code.style=official
kotlin.incremental=true
