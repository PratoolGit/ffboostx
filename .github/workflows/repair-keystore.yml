name: Prepare FF BoostX Keystore

on:
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest

    steps:
      - name: Check signing secret
        env:
          KEYSTORE: ${{ secrets.FF_KEYSTORE }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "FF_KEYSTORE is empty or does not exist."
            exit 1
          fi

          echo "FF_KEYSTORE is present."
          echo "Length: ${#KEYSTORE}"

      - name: Decode and validate keystore
        env:
          KEYSTORE: ${{ secrets.FF_KEYSTORE }}
        run: |
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/test.jks"

          file "$RUNNER_TEMP/test.jks"

          keytool -list \
            -keystore "$RUNNER_TEMP/test.jks" \
            -storepass "${{ secrets.FF_STORE_PASSWORD }}"
