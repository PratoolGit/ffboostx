name: Create FF BoostX Signing Key

on:
  workflow_dispatch:

jobs:
  create:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate keystore
        env:
          STORE_PASSWORD: ${{ secrets.FF_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.FF_KEY_PASSWORD }}
        run: |
          keytool -genkeypair \
            -v \
            -keystore ffboostx-release.jks \
            -alias ffboostx \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=FF BoostX, OU=Development, O=FF BoostX, L=India, ST=Jharkhand, C=IN"

      - name: Encode keystore
        run: |
          base64 -w 0 ffboostx-release.jks > ffboostx-release-base64.txt

      - name: Upload encoded keystore
        uses: actions/upload-artifact@v4
        with:
          name: ffboostx-signing-key
          path: ffboostx-release-base64.txt