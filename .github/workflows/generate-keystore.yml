name: Generate FF BoostX Signing Key

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate keystore
        env:
          STORE_PASSWORD: ${{ secrets.FF_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.FF_KEY_PASSWORD }}
        run: |
          keytool -genkeypair \
            -v \
            -keystore "$RUNNER_TEMP/ffboostx-release.jks" \
            -alias ffboostx \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=FF BoostX, OU=Development, O=FF BoostX, L=India, ST=Jharkhand, C=IN"

      - name: Convert keystore to Base64
        run: |
          base64 -w 0 "$RUNNER_TEMP/ffboostx-release.jks" \
            > "$RUNNER_TEMP/ffboostx-release-base64.txt"

      - name: Verify Base64
        run: |
          base64 --decode \
            "$RUNNER_TEMP/ffboostx-release-base64.txt" \
            > "$RUNNER_TEMP/verify.jks"

          keytool -list \
            -keystore "$RUNNER_TEMP/verify.jks" \
            -storepass "${{ secrets.FF_STORE_PASSWORD }}"

      - name: Upload Base64 keystore
        uses: actions/upload-artifact@v4
        with:
          name: FF-BoostX-Signing-Key-Base64
          path: ${{ runner.temp }}/ffboostx-release-base64.txt
