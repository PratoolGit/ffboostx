name: Create FF BoostX Release Key

on:
  workflow_dispatch:

jobs:
  create-key:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate PKCS12 keystore
        env:
          STORE_PASSWORD: ${{ secrets.FF_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.FF_KEY_PASSWORD }}
        run: |
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/ffboostx-release.jks" \
            -storetype PKCS12 \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -alias ffboostx \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=FF BoostX, OU=Development, O=FF BoostX, L=India, ST=Jharkhand, C=IN"

      - name: Validate keystore
        env:
          STORE_PASSWORD: ${{ secrets.FF_STORE_PASSWORD }}
        run: |
          keytool -list \
            -v \
            -keystore "$RUNNER_TEMP/ffboostx-release.jks" \
            -storepass "$STORE_PASSWORD"

      - name: Create Base64
        run: |
          base64 -w 0 "$RUNNER_TEMP/ffboostx-release.jks" \
            > "$RUNNER_TEMP/ffboostx-release.txt"

      - name: Verify Base64 round trip
        env:
          STORE_PASSWORD: ${{ secrets.FF_STORE_PASSWORD }}
        run: |
          base64 --decode \
            "$RUNNER_TEMP/ffboostx-release.txt" \
            > "$RUNNER_TEMP/verified.jks"

          keytool -list \
            -keystore "$RUNNER_TEMP/verified.jks" \
            -storepass "$STORE_PASSWORD"

      - name: Upload Base64
        uses: actions/upload-artifact@v4
        with:
          name: FF-BoostX-Keystore-Base64
          path: ${{ runner.temp }}/ffboostx-release.txt
