name: Build FF BoostX Release APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore permanent signing keystore
        env:
          FF_KEYSTORE: ${{ secrets.FF_KEYSTORE }}
          FF_STORE_PASSWORD: ${{ secrets.FF_STORE_PASSWORD }}
        run: |
          if [ -z "$FF_KEYSTORE" ] || [ -z "$FF_STORE_PASSWORD" ]; then
            echo "::error::FF_KEYSTORE / FF_STORE_PASSWORD secrets are missing. Run 'Create FF BoostX Release Key' once, then save its output as the FF_KEYSTORE secret."
            exit 1
          fi
          printf '%s' "$FF_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/ffboostx-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/ffboostx-release.jks" \
            -storepass "$FF_STORE_PASSWORD" -alias ffboostx

      - name: Build signed release APK
        env:
          FF_STORE_PASSWORD: ${{ secrets.FF_STORE_PASSWORD }}
        run: |
          gradle assembleRelease \
            -PffKeystore="$RUNNER_TEMP/ffboostx-release.jks" \
            -PffStorePassword="$FF_STORE_PASSWORD" \
            -PffKeyAlias="ffboostx" \
            -PffKeyPassword="$FF_STORE_PASSWORD"

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose \
            app/build/outputs/apk/release/app-release.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: FF-BoostX-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
