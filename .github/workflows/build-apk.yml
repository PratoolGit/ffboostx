name: Build FF BoostX Release APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create signing keystore
        env:
          FF_STORE_PASSWORD: ${{ secrets.FF_STORE_PASSWORD }}
        run: |
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/ffboostx-release.jks" \
            -storetype PKCS12 \
            -storepass "$FF_STORE_PASSWORD" \
            -keypass "$FF_STORE_PASSWORD" \
            -alias ffboostx \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=FF BoostX, OU=Development, O=FF BoostX, L=India, ST=Jharkhand, C=IN"

      - name: Build signed release APK
        env:
          FF_STORE_PASSWORD: ${{ secrets.FF_STORE_PASSWORD }}
        run: |
          gradle assembleRelease \
            -PffKeystore="$RUNNER_TEMP/ffboostx-release.jks" \
            -PffStorePassword="$FF_STORE_PASSWORD" \
            -PffKeyAlias="ffboostx" \
            -PffKeyPassword="$FF_STORE_PASSWORD"

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose \
            app/build/outputs/apk/release/app-release.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: FF-BoostX-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
